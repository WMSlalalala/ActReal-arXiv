plugins {
    id "com.android.application"
}

android {
    namespace "com.actreal.target"
    compileSdk 35

    defaultConfig {
        applicationId "com.actreal.target"
        minSdk 34
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
